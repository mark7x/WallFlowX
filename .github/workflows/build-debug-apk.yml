name: Build debug APK

permissions:
  contents: "read"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore fixed debug signing key
        env:
          CI_KEYSTORE_B64: ${{ secrets.CI_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$CI_KEYSTORE_B64" ]; then
            printf '%s' "$CI_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ci-debug.jks"
            echo "CI_DEBUG_KEYSTORE=$RUNNER_TEMP/ci-debug.jks" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        env:
          CI_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.CI_DEBUG_KEYSTORE_PASSWORD }}
          CI_DEBUG_KEY_ALIAS: ${{ secrets.CI_DEBUG_KEY_ALIAS }}
          CI_DEBUG_KEY_PASSWORD: ${{ secrets.CI_DEBUG_KEY_PASSWORD }}
        run: ./gradlew clean assembleDebug -Pgithub

      - uses: actions/upload-artifact@v4
        with:
          name: wallflowx-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
